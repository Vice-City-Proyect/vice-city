name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, TypeScript, and tests
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
      NEXTAUTH_SECRET: test-secret-key-vice-city-auth-123456
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (Strict frozen npm ci)
        id: install
        run: npm ci

      - name: Verify dependencies integrity (package.json & package-lock.json)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code package.json package-lock.json

      - name: Run ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
