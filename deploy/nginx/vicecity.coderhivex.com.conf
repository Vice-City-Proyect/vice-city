# ==============================================================================
# Configuración Nginx para Vice City (Reverse Proxy)
# Dominio: vicecity.coderhivex.com -> 127.0.0.1:3000
# ==============================================================================
#
# Pasos de instalación en el VPS Ubuntu:
# 1. Copiar este archivo al directorio de Nginx:
#      sudo cp deploy/nginx/vicecity.coderhivex.com.conf /etc/nginx/sites-available/
# 2. Habilitar el sitio mediante enlace simbólico:
#      sudo ln -s /etc/nginx/sites-available/vicecity.coderhivex.com.conf /etc/nginx/sites-enabled/
# 3. Validar la sintaxis de Nginx:
#      sudo nginx -t
# 4. Recargar Nginx para aplicar la configuración:
#      sudo systemctl reload nginx
# 5. Obtener el certificado SSL/TLS con Certbot:
#      sudo certbot --nginx -d vicecity.coderhivex.com
#    (Certbot modificará automáticamente este archivo para redirigir HTTP a HTTPS y enlazar los certificados)
# 6. Probar la renovación automática:
#      sudo certbot renew --dry-run
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name vicecity.coderhivex.com;

    # Tamaño máximo de carga para peticiones y formularios
    client_max_body_size 10M;

    # Logs de acceso y errores independientes para diagnóstico
    access_log /var/log/nginx/vicecity_access.log;
    error_log /var/log/nginx/vicecity_error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cabeceras para WebSocket y soporte de hot-reload / streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Cabeceras de reenvío de cliente (IP real y protocolo para NextAuth)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts adecuados para transacciones y webhooks de Stripe
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Deshabilitar bypass de caché local para evitar páginas estancadas
        proxy_cache_bypass $http_upgrade;
    }
}

